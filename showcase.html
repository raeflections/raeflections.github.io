<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="raeflections — photography archive">
  <title>raeflections — Showcase</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">raeflections</a>
    <nav class="nav" aria-label="Main navigation">
      <a href="index.html">Featured</a>
      <a class="active" href="showcase.html">Showcase</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="page">
    <section class="intro">
      <h1>Insert Header (Other showcase)</h1>
      <p class="intro-copy">Insert description</p>
    </section>

    <section class="showcase-grid" aria-label="Photography archive">
      <figure class="photo-card showcase-card">
        <button class="photo-button" type="button" data-full="images/showcase/01.jpg" data-title="Showcase 01" data-tags="#insert tag">
          <img src="images/showcase/01.jpg" alt="Showcase photograph 01" onerror="this.parentElement.classList.add('missing')">
          <span class="placeholder">01.jpg</span>
        </button>
        <figcaption><span>Showcase 01</span><span class="tags">#insert tag</span></figcaption>
      </figure>

      <figure class="photo-card showcase-card">
        <button class="photo-button" type="button" data-full="images/showcase/02.jpg" data-title="Showcase 02" data-tags="#insert tag">
          <img src="images/showcase/02.jpg" alt="Showcase photograph 02" onerror="this.parentElement.classList.add('missing')">
          <span class="placeholder">02.jpg</span>
        </button>
        <figcaption><span>Showcase 02</span><span class="tags">#insert tag</span></figcaption>
      </figure>

      <figure class="photo-card showcase-card">
        <button class="photo-button" type="button" data-full="images/showcase/03.jpg" data-title="Showcase 03" data-tags="#insert tag">
          <img src="images/showcase/03.jpg" alt="Showcase photograph 03" onerror="this.parentElement.classList.add('missing')">
          <span class="placeholder">03.jpg</span>
        </button>
        <figcaption><span>Showcase 03</span><span class="tags">#insert tag</span></figcaption>
      </figure>

      <figure class="photo-card showcase-card">
        <button class="photo-button" type="button" data-full="images/showcase/04.jpg" data-title="Showcase 04" data-tags="#insert tag">
          <img src="images/showcase/04.jpg" alt="Showcase photograph 04" onerror="this.parentElement.classList.add('missing')">
          <span class="placeholder">04.jpg</span>
        </button>
        <figcaption><span>Showcase 04</span><span class="tags">#insert tag</span></figcaption>
      </figure>

      <figure class="photo-card showcase-card">
        <button class="photo-button" type="button" data-full="images/showcase/05.jpg" data-title="Showcase 05" data-tags="#insert tag">
          <img src="images/showcase/05.jpg" alt="Showcase photograph 05" onerror="this.parentElement.classList.add('missing')">
          <span class="placeholder">05.jpg</span>
        </button>
        <figcaption><span>Showcase 05</span><span class="tags">#insert tag</span></figcaption>
      </figure>

      <figure class="photo-card showcase-card">
        <button class="photo-button" type="button" data-full="images/showcase/06.jpg" data-title="Showcase 06" data-tags="#insert tag">
          <img src="images/showcase/06.jpg" alt="Showcase photograph 06" onerror="this.parentElement.classList.add('missing')">
          <span class="placeholder">06.jpg</span>
        </button>
        <figcaption><span>Showcase 06</span><span class="tags">#insert tag</span></figcaption>
      </figure>
    </section>
  </main>

  <footer><span>© <span id="year"></span> raeflections</span><span>photography by rae</span></footer>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" type="button" aria-label="Close image">×</button>
    <div class="lightbox-inner">
      <img id="lightbox-image" src="" alt="">
      <div class="lightbox-meta">
        <span id="lightbox-title"></span>
        <span id="lightbox-tags"></span>
      </div>
    </div>
  </div>

  <script src="js/gallery.js"></script>
</body>
</html>
