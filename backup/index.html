<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="raeflections — photography portfolio">
  <title>raeflections — Featured</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">raeflections</a>
    <nav class="nav" aria-label="Main navigation">
      <a class="active" href="index.html">Featured</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="page">
    <section class="featured-profile">
      <div class="featured-profile-left">
        <p class="bio">#insert bio</p>

      <div class="social-links">
        <a href="https://www.instagram.com/rae.flections?stkn=MWtrdWx0bXM1YjA1aQ==" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle class="fill-dot" cx="17.5" cy="6.5" r="1"></circle>
          </svg>
          <span>Instagram</span>
        </a>

        <a href="https://www.linkedin.com/in/rae-en-hoo-a04315285?utm_source=share_via&utm_content=profile&utm_medium=member_ios" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <path d="M7.5 10v7M7.5 7.3v.1M11 17v-7m0 3c.7-2.4 5.5-2.6 5.5 1.1V17"></path>
          </svg>
          <span>LinkedIn</span>
        </a>

        <a
          href="mailto:raeenhoo@gmail.com"
          aria-label="Email"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <path d="M4 7l8 6 8-6"></path>
          </svg>
          <span>raeenhoo@gmail.com</span>
        </a>
      </div>
      </div>

      <div class="featured-skills">
        <div class="skill-header">SKILLSET</div>

        <div class="skill">
          <div class="skill-info"><span>Photography</span><span class="skill-percent"></span></div>
          <div class="skill-bar"><div class="skill-progress" data-percent="90"></div></div>
        </div>

        <div class="skill">
          <div class="skill-info"><span>Photo Editing</span><span class="skill-percent"></span></div>
          <div class="skill-bar"><div class="skill-progress" data-percent="85"></div></div>
        </div>

        <div class="skill">
          <div class="skill-info"><span>Lightroom</span><span class="skill-percent"></span></div>
          <div class="skill-bar"><div class="skill-progress" data-percent="80"></div></div>
        </div>

        <div class="skill">
          <div class="skill-info"><span>Videography</span><span class="skill-percent"></span></div>
          <div class="skill-bar"><div class="skill-progress" data-percent="70"></div></div>
        </div>
      </div>
    </section>

    <section class="featured-section" aria-label="Featured photographs">
      <div class="featured-scroll">
        <div class="featured-row featured-row-three">
          <figure class="photo-card">
            <button class="photo-button" type="button" data-full="images/featured/Arnex Publicity Project.png">
              <img src="images/featured/Arnex Publicity Project.png" alt="Featured photograph 01" onerror="this.parentElement.classList.add('missing')">
            </button>
            <figcaption><span class="tags">#insert tag</span></figcaption>
          </figure>

          <figure class="photo-card">
            <button class="photo-button" type="button" data-full="images/featured/Graduation Publicity Project.png">
              <img src="images/featured/Graduation Publicity Project.png" alt="Featured photograph 02" onerror="this.parentElement.classList.add('missing')">
            </button>
            <figcaption><span class="tags">#insert tag</span></figcaption>
          </figure>

          <figure class="photo-card">
            <button class="photo-button" type="button" data-full="images/featured/Sikkim Publicity Project.png">
              <img src="images/featured/Sikkim Publicity Project.png" alt="Featured photograph 03" onerror="this.parentElement.classList.add('missing')">
            </button>
            <figcaption><span class="tags">#insert tag</span></figcaption>
          </figure>
        </div>

        <div class="featured-row featured-row-four">
          <figure class="photo-card">
            <button class="photo-button" type="button" data-full="images/featured/04.jpg" data-title="Photo 04" data-tags="#architecture #lines">
              <img src="images/featured/04.jpg" alt="Featured photograph 04" onerror="this.parentElement.classList.add('missing')">
              <span class="placeholder">04.jpg</span>
            </button>
            <figcaption><span class="tags">#insert tag</span></figcaption>
          </figure>

          <figure class="photo-card">
            <button class="photo-button" type="button" data-full="images/featured/Landscape Photography.jpg">
              <img src="images/featured/Landscape Photography.jpg" alt="Featured photograph 05" onerror="this.parentElement.classList.add('missing')">
            </button>
            <figcaption><span class="tags">#insert tag</span></figcaption>
          </figure>

          <figure class="photo-card">
            <button class="photo-button" type="button" data-full="images/featured/Street Photography.jpg">
              <img src="images/featured/Street Photography.jpg" alt="Featured photograph 06" onerror="this.parentElement.classList.add('missing')">
            </button>
            <figcaption><span class="tags">#insert tag</span></figcaption>
          </figure>

          <figure class="photo-card">
            <button class="photo-button" type="button" data-full="images/featured/Nature Photography.jpg">
              <img src="images/featured/Nature Photography.jpg" alt="Featured photograph 07" onerror="this.parentElement.classList.add('missing')">
            </button>
            <figcaption><span class="tags">#insert tag</span></figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>

  <footer><span>© <span id="year"></span> raeflections</span><span>photography by rae</span></footer>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" type="button" aria-label="Close image">×</button>
    <div class="lightbox-inner">
      <img id="lightbox-image" src="" alt="">
      <div class="lightbox-meta">
        <span id="lightbox-title"></span>
        <span id="lightbox-tags"></span>
      </div>
    </div>
  </div>

  <script src="js/gallery.js"></script>
</body>
</html>
