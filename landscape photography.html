<!DOCTYPE html>

        <div class="justify-center">
          <dl class="project-meta">

            <dt>Category</dt><dd>Photography</dd>
          </dl>
          <div class="project-copy">
            <p><strong>Landscape Photography</strong></p>
            <p>Personal photography taken overseas on mobile and point-and-shoot film camera, and edited with Hypic mobile app.</p>
          </div>
        </div>
      </aside>
    </div>

  <footer><span>© <span id="year"></span> raeflections</span><span>photography by rae</span></footer>
  <script src="js/gallery.js"></script>
