<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="raeflections — photography portfolio">
  <title>raeflections — Featured</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">raeflections</a>
    <nav class="nav" aria-label="Main navigation">
      <a class="active" href="index.html">Featured</a>
      <a href="showcase.html">Showcase</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="page">
    <section class="intro">
      <h1>Featured</h1>
      <p class="intro-copy">Seven frames, seven moments.</p>
    </section>

    <section class="featured-section" aria-label="Featured photographs">
      <div class="featured-scroll">
        <div class="featured-row featured-row-three">
          <figure class="photo-card">
            <button class="photo-button" type="button" data-full="images/featured/01.jpg" data-title="Photo 01" data-tags="#portrait #light">
              <img src="images/featured/01.jpg" alt="Featured photograph 01" onerror="this.parentElement.classList.add('missing')">
              <span class="placeholder">01.jpg</span>
            </button>
            <figcaption><span>Photo 01</span><span class="tags">#insert tag</span></figcaption>
          </figure>

          <figure class="photo-card">
            <button class="photo-button" type="button" data-full="images/featured/02.jpg" data-title="Photo 02" data-tags="#street #city">
              <img src="images/featured/02.jpg" alt="Featured photograph 02" onerror="this.parentElement.classList.add('missing')">
              <span class="placeholder">02.jpg</span>
            </button>
            <figcaption><span>Photo 02</span><span class="tags">#insert tag</span></figcaption>
          </figure>

          <figure class="photo-card">
            <button class="photo-button" type="button" data-full="images/featured/03.jpg" data-title="Photo 03" data-tags="#travel #colour">
              <img src="images/featured/03.jpg" alt="Featured photograph 03" onerror="this.parentElement.classList.add('missing')">
              <span class="placeholder">03.jpg</span>
            </button>
            <figcaption><span>Photo 03</span><span class="tags">#insert tag</span></figcaption>
          </figure>
        </div>

        <div class="featured-row featured-row-four">
          <figure class="photo-card">
            <button class="photo-button" type="button" data-full="images/featured/04.jpg" data-title="Photo 04" data-tags="#architecture #lines">
              <img src="images/featured/04.jpg" alt="Featured photograph 04" onerror="this.parentElement.classList.add('missing')">
              <span class="placeholder">04.jpg</span>
            </button>
            <figcaption><span>Photo 04</span><span class="tags">#insert tag</span></figcaption>
          </figure>

          <figure class="photo-card">
            <button class="photo-button" type="button" data-full="images/featured/05.jpg" data-title="Photo 05" data-tags="#night #street">
              <img src="images/featured/05.jpg" alt="Featured photograph 05" onerror="this.parentElement.classList.add('missing')">
              <span class="placeholder">05.jpg</span>
            </button>
            <figcaption><span>Photo 05</span><span class="tags">#insert tag</span></figcaption>
          </figure>

          <figure class="photo-card">
            <button class="photo-button" type="button" data-full="images/featured/06.jpg" data-title="Photo 06" data-tags="#nature #quiet">
              <img src="images/featured/06.jpg" alt="Featured photograph 06" onerror="this.parentElement.classList.add('missing')">
              <span class="placeholder">06.jpg</span>
            </button>
            <figcaption><span>Photo 06</span><span class="tags">#ninsert tag</span></figcaption>
          </figure>

          <figure class="photo-card">
            <button class="photo-button" type="button" data-full="images/featured/07.jpg" data-title="Photo 07" data-tags="#people #moment">
              <img src="images/featured/07.jpg" alt="Featured photograph 07" onerror="this.parentElement.classList.add('missing')">
              <span class="placeholder">07.jpg</span>
            </button>
            <figcaption><span>Photo 07</span><span class="tags">#insert tag</span></figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>

  <footer><span>© <span id="year"></span> raeflections</span><span>photography by rae</span></footer>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" type="button" aria-label="Close image">×</button>
    <div class="lightbox-inner">
      <img id="lightbox-image" src="" alt="">
      <div class="lightbox-meta">
        <span id="lightbox-title"></span>
        <span id="lightbox-tags"></span>
      </div>
    </div>
  </div>

  <script src="js/gallery.js"></script>
</body>
</html>
