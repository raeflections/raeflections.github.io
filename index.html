<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="raeflections — photography portfolio">
  <title>raeflections</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">raeflections</a>
    <nav class="nav" aria-label="Main navigation">
      <a class="active" href="index.html">Featured</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="page">
    <section class="featured-profile">
      <div class="featured-profile-left">
        <p class="bio">#insert bio</p>

      <div class="social-links">
        <a href="https://www.instagram.com/rae.flections?stkn=MWtrdWx0bXM1YjA1aQ==" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle class="fill-dot" cx="17.5" cy="6.5" r="1"></circle>
          </svg>
          <span>Instagram</span>
        </a>

        <a href="https://www.linkedin.com/in/rae-en-hoo-a04315285?utm_source=share_via&utm_content=profile&utm_medium=member_ios" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <path d="M7.5 10v7M7.5 7.3v.1M11 17v-7m0 3c.7-2.4 5.5-2.6 5.5 1.1V17"></path>
          </svg>
          <span>LinkedIn</span>
        </a>

        <a
          href="mailto:raeenhoo@gmail.com"
          aria-label="Email"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <path d="M4 7l8 6 8-6"></path>
          </svg>
          <span>raeenhoo@gmail.com</span>
        </a>
      </div>
      </div>

      <div class="featured-skills">
        <div class="skill-header">SKILLSET</div>

        <div class="skill">
          <div class="skill-info"><span>Photography</span><span class="skill-percent"></span></div>
          <div class="skill-bar"><div class="skill-progress" data-percent="90"></div></div>
        </div>

        <div class="skill">
          <div class="skill-info"><span>Photo Editing</span><span class="skill-percent"></span></div>
          <div class="skill-bar"><div class="skill-progress" data-percent="85"></div></div>
        </div>

        <div class="skill">
          <div class="skill-info"><span>Lightroom</span><span class="skill-percent"></span></div>
          <div class="skill-bar"><div class="skill-progress" data-percent="80"></div></div>
        </div>

        <div class="skill">
          <div class="skill-info"><span>Videography</span><span class="skill-percent"></span></div>
          <div class="skill-bar"><div class="skill-progress" data-percent="70"></div></div>
        </div>
      </div>
    </section>

    <section class="featured-section" aria-label="Featured work">
      <div class="featured-scroll">
        <div class="featured-row featured-row-three">
          <figure class="photo-card">
            <a class="photo-link" href="arnex publicity project.html" aria-label="View Arnex Publicity Project">
              <img src="images/featured/Arnex Publicity Project.webp" alt="Arnex Publicity Project" fetchpriority="high" decoding="async">
              <span class="photo-overlay"><span class="photo-overlay-title">Arnex Publicity Project</span><span class="photo-overlay-copy">View project</span></span>
            </a>
            <figcaption><span class="tags">#insert tag</span></figcaption>
          </figure>

          <figure class="photo-card">
            <a class="photo-link" href="graduation publicity project.html" aria-label="View Graduation Publicity Project">
              <img src="images/featured/Graduation Publicity Project.webp" alt="Graduation Publicity Project" fetchpriority="high" decoding="async">
              <span class="photo-overlay"><span class="photo-overlay-title">Graduation Publicity Project</span><span class="photo-overlay-copy">View project</span></span>
            </a>
            <figcaption><span class="tags">#insert tag</span></figcaption>
          </figure>

          <figure class="photo-card">
            <a class="photo-link" href="sikkim publicity project.html" aria-label="View Sikkim Publicity Project">
              <img src="images/featured/Sikkim Publicity Project.webp" alt="Sikkim Publicity Project" fetchpriority="high" decoding="async">
              <span class="photo-overlay"><span class="photo-overlay-title">Sikkim Publicity Project</span><span class="photo-overlay-copy">View project</span></span>
            </a>
            <figcaption><span class="tags">#insert tag</span></figcaption>
          </figure>
        </div>

        <div class="featured-row featured-row-four">
          <figure class="photo-card">
            <div class="photo-link photo-placeholder" aria-label="Project coming soon">
              <span class="placeholder">Project 07</span>
              <span class="photo-overlay"><span class="photo-overlay-title">Project Title</span><span class="photo-overlay-copy">Coming soon</span></span>
            </div>
            <figcaption><span class="tags">#insert tag</span></figcaption>
          </figure>

          <figure class="photo-card">
            <a class="photo-link" href="landscape photography.html" aria-label="View Landscape Photography">
              <img src="images/featured/Landscape Photography.webp" alt="Landscape Photography" loading="lazy" decoding="async">
              <span class="photo-overlay"><span class="photo-overlay-title">Landscape Photography</span><span class="photo-overlay-copy">View project</span></span>
            </a>
            <figcaption><span class="tags">#insert tag</span></figcaption>
          </figure>

          <figure class="photo-card">
            <a class="photo-link" href="street photography.html" aria-label="View Street Photography">
              <img src="images/featured/Street Photography.webp" alt="Street Photography" loading="lazy" decoding="async">
              <span class="photo-overlay"><span class="photo-overlay-title">Street Photography</span><span class="photo-overlay-copy">View project</span></span>
            </a>
            <figcaption><span class="tags">#insert tag</span></figcaption>
          </figure>

          <figure class="photo-card">
            <a class="photo-link" href="nature photography.html" aria-label="View Nature Photography">
              <img src="images/featured/Nature Photography.webp" alt="Nature Photography" loading="lazy" decoding="async">
              <span class="photo-overlay"><span class="photo-overlay-title">Nature Photography</span><span class="photo-overlay-copy">View project</span></span>
            </a>
            <figcaption><span class="tags">#insert tag</span></figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>

  <footer><span>© <span id="year"></span> raeflections</span><span>photography by rae</span></footer>

  <script src="js/gallery.js"></script>
</body>
</html>
